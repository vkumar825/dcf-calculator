[project]
name = "dcf-calculator"
version = "0.1.0"
description = "Python tool to fetch SEC EDGAR 10-K financials, project free cash flows, and run DCF valuations."
readme = "README.md"
authors = [
    { name = "Vivek Kumar", email = "vkumar01825@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edgartools>=5.62.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
